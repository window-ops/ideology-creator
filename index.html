<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideology Creator</title>
    <link rel="stylesheet" href="default.css">
  </head>
  <body>
    <header class="navbar navbar-expand-lg bg-light mb">
      <div class="container-fluid d-flex justify-content-center">
        <h3 class="my-0 text-center">Ideology Creator</h3>
      </div>
    </header>
    <div class="container-fluid pt-3">
      <form id="ideology-form">
        <div class="card mb-3">
          <div class="card-header">Name the ideology</div>
          <div class="card-body">
            <div class="form-group mb-0">
              <input type="text" class="form-control" id="ideology-name" placeholder="Enter ideology name" required>
            </div>
          </div>
        </div>
        <div class="card mb-3">
          <div class="card-header">Government Type</div>
          <div class="card-body">
            <select class="form-control" id="government" required>
              <optgroup label="Democratic Systems">
                <option value="a democracy where people elect their representatives">Representative Democracy</option>
                <option value="a direct democracy where citizens vote on all major issues">Direct Democracy</option>
                <option value="an anarchist system free of government constraints">Anarchism</option>
              </optgroup>
              <optgroup label="Authoritarian Systems">
                <option value="an authoritarian regime that values order and control">Authoritarianism</option>
                <option value="a military dictatorship where power is held by armed forces">Military Dictatorship</option>
              </optgroup>
              <optgroup label="Traditional Systems">
                <option value="a feudal system where lords own land and vassals serve them">Feudalism</option>
                <option value="a theocracy governed by religious leaders">Theocracy</option>
              </optgroup>
              <optgroup label="Technical Systems">
                <option value="a technocracy led by experts and scientists">Technocracy</option>
                <option value="a cybernetic model integrating technology and human decision-making">Cybernetics</option>
                <option value="a comprehensive government led by advanced AI">AI Governance</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div class="card mb-3">
          <div class="card-header">Economic System</div>
          <div class="card-body">
            <select class="form-control" id="economy" required>
              <optgroup label="Capitalistic systems">
                <option value="a capitalistic economy driven by free market and competition">Capitalism</option>
                <option value="an economy based on space exploration and the use of colonies to drive the free market and ensure competition">Space Capitalism</option>
                <option value="a mixed economy combining elements of both capitalism and socialism">Mixed Economy</option>
              </optgroup>
              <optgroup label="Socialistic systems">
                <option value="a socialist economy focused on equality, equity and collective ownership">Socialism</option>
                <option value="a post-scarcity socialist economy where resources are abundant, freely available and distributed to each according to their needs, focusing on equality, equity and collective ownership">Post-Scarcity Socialism</option>
                <option value="a communal economy where all resources are shared equally among all members">Communalism</option>
              </optgroup>
              <optgroup label="Informal systems">
                <option value="an informal economy that operates outside of formal regulations">Informal Economy</option>
                <option value="a barter system where goods are exchanged directly without money">Barter System</option>
                <option value="an agrarian economy based on farming and rural living">Agrarianism</option>
              </optgroup>
              <optgroup label="Futuristic systems">
                <option value="a digital economy focused on online transactions and cryptocurrencies">Digital Economy</option>
                <option value="an economy based on space exploration and outside colonies">Space Economy</option>
                <option value="a post-scarcity economy where resources are abundant and freely available">Post-Scarcity</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div class="card mb-3">
          <div class="card-header">Social Structure</div>
          <div class="card-body">
            <select class="form-control" id="society" required>
              <optgroup label="Equalitarian systems">
                <option value="an egalitarian society that promotes equal rights for all individuals">Egalitarianism</option>
                <option value="a cooperative society that values mutual aid and collective living">Cooperative society</option>
                <option value="a cosmopolitan society that values diversity and global citizenship">Cosmopolitanism</option>
              </optgroup>
              <optgroup label="Individualistic systems">
                <option value="an individualistic society where personal freedom is prioritized over collective needs">Individualism</option>
                <option value="a meritocratic society where individuals advance based on ability and talent">Meritocracy</option>
              </optgroup>
              <optgroup label="Hierarchical systems">
                <option value="a hierarchical society that values social status and roles">Hierarchical Society</option>
                <option value="an age-based society that values experience and seniority">Gerontocracy</option>
              </optgroup>
              <optgroup label="Primitive systems">
                <option value="a tribal society that values kinship and community bonds">Tribalism</option>
                <option value="a nomadic society that moves frequently in search of resources or better living conditions">Nomadism</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div class="card mb-3">
          <div class="card-header">Cultural Approach</div>
          <div class="card-body">
            <select class="form-control" id="culture" required>
              <optgroup label="Progressive approaches">
                <option value="a multicultural approach celebrating diverse cultures and traditions">Multiculturalism</option>
                <option value="a globalist perspective advocating for interconnectedness among cultures worldwide">Globalization</option>
              </optgroup>
            <optgroup label="Technological approaches">
                <option value="a digital approach focused on online interactions and social media">Digital Culture</option>
                <option value="an approach based on the prospect of exploring space and colonizing other planes">Space Culture</option>
              </optgroup>
              <optgroup label="Conservative approaches">
                <option value="a nationalistic approach emphasizing a single national identity">Nationalism</option>
                <option value="an assimilationist approach encouraging cultural uniformity">Assimilationism</option>
                <option value="a traditionalist approach valuing historical customs and practices over modern influences">Traditionalism</option>
              </optgroup>
              <optgroup label="Non-mainstream approaches">
                <option value="an avant-garde approach promoting radical artistic expression and innovation">Avant-Garde</option>
                <option value="a countercultural movement questioning mainstream societal norms through alternative lifestyles">Counterculture</option>
              </optgroup>
            </select>
          </div>
        </div>
        <div class="card mb-3">
          <div class="card-header">Environmental Policy</div>
          <div class="card-body">
            <select class="form-control" id="environment" required>
              <optgroup label="Simple ecological policies">
                <option value="an environmentally sustainable practices, prioritizing green technologies">Eco-Friendliness</option>
                <option value="a approach of conservation that protects natural resources at all costs">Conservationism</option>
                <option value="an anti-industrial approach opposing large-scale production for environmental reasons">Anti-Industrialism</option>
              </optgroup>
              <optgroup label="Complex ecological policies">
                <option value="a radical environmentalist approach advocating for deep ecological changes">Radical Environmentalism</option>
                <option value="an ecosystem-based management strategy focusing on preserving entire ecosystems rather than individual species or resources">Ecosystem Management</option>
                <option value="an environmental justice approach ensuring equitable distribution of environmental benefits and burdens across all communities">Environmental Justice</option>
              </optgroup>
              <optgroup label="Modernist ecological policies">
                <option value="an urban-centric approach promoting sustainable city living practices">Urban Sustainability</option>
                <option value="a geoengineering approach aimed at manipulating Earth's climate to combat global warming">Geoengineering Policy</option>
              </optgroup>
              <optgroup label="Industrialist policies">
                <option value="an industrial approach focused on economic growth regardless of environmental impact">Industrial Growth</option>
                <option value="an expansionist approach that encourages the exploitation of natural resources for development">Resource Exploitation</option>
              </optgroup>
              <optgroup label="Futuristic policies">
                <option value="a approach focused on terraforming and off-world sustainability">Terraforming</option>
                <option value="a approach focused on advanced biotechnology and genetic engineering">Biotechnology Policy</option>
              </optgroup>
            </select>
          </div>
        </div>
        <button type='button' class='btn btn-primary mb-3' id='generate-ideology-btn'>Generate ideology</button>
        <div class='card mb-3'>
          <div class='card-header'>Created ideology</div>
          <div class='card-body'>
            <p id='result-text' class='mb-0'>No ideology has been created yet.</p>
          </div>
        </div>
        <script src='script.js'></script>
      </form>
    </div>
  </body>
</html>
